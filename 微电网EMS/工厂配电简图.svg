<svg xmlns="http://www.w3.org/2000/svg" width="880" height="730" viewBox="0 0 880 730"><rect width="880" height="730" fill="#fff"/><g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#172b4d"><text x="440" y="35" font-size="24" font-weight="bold">工厂光储配电简图</text><text x="440" y="62" font-size="14" fill="#64748b">教学简化：单线表示三相连接，省略总开关、计量及其他保护</text><g stroke="#475569" stroke-width="3" fill="none"><path d="M440 130V170M440 250V310M170 330V390M440 330V390M710 330V390M170 450V520M440 450V520M710 460V520"/></g><rect x="340" y="85" width="200" height="45" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="440" y="114" font-size="19">公共电网</text><rect x="310" y="170" width="260" height="80" rx="8" fill="#eaf2ff" stroke="#6693ce"/><text x="440" y="201" font-size="20">变压器 1600 kVA</text><text x="440" y="230" font-size="16">承担全厂净 P、净 Q</text><text x="602" y="280" font-size="14" fill="#526987">看总入口的负担</text><rect x="80" y="310" width="720" height="20" rx="3" fill="#42658d"/><text x="440" y="300" font-size="18">工厂交流母线（三相 400 V）</text><rect x="70" y="390" width="200" height="60" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="170" y="426" font-size="18">负荷支路开关</text><rect x="340" y="390" width="200" height="60" rx="7" fill="#f1f5f9" stroke="#94a3b8"/><text x="440" y="426" font-size="18">光伏支路开关</text><rect x="600" y="390" width="220" height="70" rx="7" fill="#fff3d6" stroke="#d29c31"/><text x="710" y="418" font-size="17">储能支路开关及线路</text><text x="710" y="444" font-size="16">持续电流限值：800 A</text><rect x="60" y="520" width="220" height="85" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="170" y="552" font-size="20">工厂负荷</text><text x="170" y="582" font-size="16">980 kW / 735 kvar</text><rect x="330" y="520" width="220" height="85" rx="8" fill="#e8f5ec" stroke="#6aa17c"/><text x="440" y="552" font-size="20">光伏及逆变器</text><text x="440" y="582" font-size="17">发电 400 kW</text><rect x="600" y="520" width="220" height="85" rx="8" fill="#fff3d6" stroke="#d29c31"/><text x="710" y="552" font-size="20">PCS + 电池</text><text x="710" y="582" font-size="17">充电 / 放电</text><text x="440" y="650" font-size="18" font-weight="bold">三条支路并联在母线上，不是依次串联。</text><text x="440" y="682" font-size="16">光伏能减少变压器购电，但进入储能的电仍须经过储能支路。</text><text x="440" y="711" font-size="14" fill="#64748b">连线表示电气连接，不限定潮流方向；本图不是施工或保护设计图。</text></g></svg>