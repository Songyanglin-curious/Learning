<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1100" height="530" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" fill="#0f172a"><text x="40" y="42" font-size="26" font-weight="700">Fixture：测试类范围与每次调用范围</text><text x="40" y="75" font-size="15" fill="#475569">下面假定 A 先于 B，仅示意；不要让测试依赖默认执行顺序。</text><path d="M 320 151 L 400 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 151 L 760 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 900 192 L 900 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 760 351 L 680 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 351 L 320 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="142" font-size="18" font-weight="600">@BeforeAll</text><text x="58" y="170" font-size="14" fill="#475569">当前测试类开始时一次</text><rect x="400" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="142" font-size="18" font-weight="600">新测试实例 A</text><text x="418" y="170" font-size="14" fill="#475569">BeforeEach → 测试 A</text><rect x="760" y="110" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="142" font-size="18" font-weight="600">@AfterEach</text><text x="778" y="170" font-size="14" fill="#475569">测试 A 的收尾</text><rect x="760" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="778" y="342" font-size="18" font-weight="600">新测试实例 B</text><text x="778" y="370" font-size="14" fill="#475569">BeforeEach → 测试 B</text><rect x="400" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="342" font-size="18" font-weight="600">@AfterEach</text><text x="418" y="370" font-size="14" fill="#475569">测试 B 的收尾</text><rect x="40" y="310" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="58" y="342" font-size="18" font-weight="600">@AfterAll</text><text x="58" y="370" font-size="14" fill="#475569">当前测试类结束时一次</text><text x="40" y="495" font-size="15" fill="#475569">默认 PER_METHOD；参数化测试每组数据也有 Each 回调。新实例不隔离静态或外部状态。</text></g></svg>
