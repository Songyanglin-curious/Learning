<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1100" height="530" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" fill="#0f172a"><text x="40" y="42" font-size="26" font-weight="700">关键时机：先改注册，再创建依赖对象</text><text x="40" y="75" font-size="15" fill="#475569">逻辑阶段图，不是框架源码逐行调用栈；ASP.NET Core 与 Spring 具体机制不同。</text><path d="M 320 151 L 400 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 151 L 760 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 900 192 L 900 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 760 351 L 680 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 351 L 320 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="142" font-size="18" font-weight="600">测试启动工具</text><text x="58" y="170" font-size="14" fill="#475569">工厂 / Spring TestContext</text><rect x="400" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="142" font-size="18" font-weight="600">读取应用原有配置</text><text x="418" y="170" font-size="14" fill="#475569">真实实现的注册或 Bean 定义</text><rect x="760" y="110" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="142" font-size="18" font-weight="600">测试扩展点介入</text><text x="778" y="170" font-size="14" fill="#475569">移除并添加 / Bean override</text><rect x="760" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="778" y="342" font-size="18" font-weight="600">准备容器与业务对象</text><text x="778" y="370" font-size="14" fill="#475569">注入的已是测试替身</text><rect x="400" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="342" font-size="18" font-weight="600">配置 Mock 返回行为</text><text x="418" y="370" font-size="14" fill="#475569">通常在测试准备阶段 when</text><rect x="40" y="310" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="58" y="342" font-size="18" font-weight="600">发请求并断言响应</text><text x="58" y="370" font-size="14" fill="#475569">结束后收尾；上下文可复用</text><text x="40" y="495" font-size="15" fill="#475569">创建替身 ≠ 注册替身 ≠ 配置返回行为。若启动时已调用 Mock，BeforeEach 设置行为可能太晚。</text></g></svg>
