<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1100" height="650" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" fill="#0f172a"><text x="40" y="42" font-size="26" font-weight="700">API 测试：入口与真实依赖是两个独立选择</text><text x="40" y="75" font-size="15" fill="#475569">每行从左到右；蓝色为请求路径，绿色为可选测试替身。</text><path d="M 320 151 L 400 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 151 L 760 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 320 311 L 400 311" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 311 L 760 311" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 320 471 L 400 471" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 471 L 760 471" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="142" font-size="18" font-weight="600">直接方法调用</text><text x="58" y="170" font-size="14" fill="#475569">测试 new 对象或取对象</text><rect x="400" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="142" font-size="18" font-weight="600">Service / Controller</text><text x="418" y="170" font-size="14" fill="#475569">不走 Web 路由和绑定</text><rect x="760" y="110" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="142" font-size="18" font-weight="600">真实依赖或替身</text><text x="778" y="170" font-size="14" fill="#475569">根据目标主动选择</text><rect x="40" y="270" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="302" font-size="18" font-weight="600">MockMvc / TestServer</text><text x="58" y="330" font-size="14" fill="#475569">进程内请求，无真实监听</text><rect x="400" y="270" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="302" font-size="18" font-weight="600">Web 处理链</text><text x="418" y="330" font-size="14" fill="#475569">路由、绑定、Controller 等</text><rect x="760" y="270" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="302" font-size="18" font-weight="600">真实依赖或替身</text><text x="778" y="330" font-size="14" fill="#475569">无 socket 不等于无数据库</text><rect x="40" y="430" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="462" font-size="18" font-weight="600">真实 HTTP 客户端</text><text x="58" y="490" font-size="14" fill="#475569">本机随机端口或外部地址</text><rect x="400" y="430" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="462" font-size="18" font-weight="600">真实监听服务器</text><text x="418" y="490" font-size="14" fill="#475569">网络入口 + Web 处理链</text><rect x="760" y="430" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="462" font-size="18" font-weight="600">真实依赖或替身</text><text x="778" y="490" font-size="14" fill="#475569">真实 HTTP 也可配 Mock</text><text x="40" y="615" font-size="15" fill="#475569">MockMvc 自身不决定加载范围；应用可用测试容器，而外部数据库仍然必须显式隔离。</text></g></svg>
