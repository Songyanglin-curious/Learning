<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1100" height="530" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" fill="#0f172a"><text x="40" y="42" font-size="26" font-weight="700">从普通 Java 到 JUnit：谁调用谁</text><text x="40" y="75" font-size="15" fill="#475569">编译和运行分开；JUnit 不替我们决定业务规则与预期值。</text><path d="M 320 151 L 400 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 680 151 L 760 151" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 900 192 L 900 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 760 351 L 680 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 400 351 L 320 351" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="40" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="58" y="142" font-size="18" font-weight="600">javac 编译</text><text x="58" y="170" font-size="14" fill="#475569">源码 → 字节码</text><rect x="400" y="110" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="142" font-size="18" font-weight="600">JVM 启动 JAR</text><text x="418" y="170" font-size="14" fill="#475569">Console Launcher 读取参数</text><rect x="760" y="110" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="778" y="142" font-size="18" font-weight="600">Platform / Jupiter</text><text x="778" y="170" font-size="14" fill="#475569">选定类，识别 @Test</text><rect x="760" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="778" y="342" font-size="18" font-weight="600">调用测试方法</text><text x="778" y="370" font-size="14" fill="#475569">默认每方法新建测试实例</text><rect x="400" y="310" width="280" height="82" rx="8" fill="#eff6ff" stroke="#94a3b8"/><text x="418" y="342" font-size="18" font-weight="600">测试调用业务代码</text><text x="418" y="370" font-size="14" fill="#475569">拿到结果，执行断言</text><rect x="40" y="310" width="280" height="82" rx="8" fill="#ecfdf5" stroke="#94a3b8"/><text x="58" y="342" font-size="18" font-weight="600">JUnit 记录并汇总</text><text x="58" y="370" font-size="14" fill="#475569">失败通常不阻止其他测试</text><text x="40" y="495" font-size="15" fill="#475569">@Test 是标记；assertEquals 是普通静态方法；空测试通过不代表业务正确。</text></g></svg>
